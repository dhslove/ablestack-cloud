name: ABLESTACK Development Release Cleanup

on:
  workflow_dispatch:
    inputs:
      base_branch:
        description: Branch whose development release should be deleted
        required: true
        default: ablestack-europa
        type: choice
        options:
          - ablestack-europa
          - ablestack-diplo

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      DEV_RELEASE_TAG: dev-${{ inputs.base_branch }}-latest
    steps:
      - name: Delete development release and tag
        uses: actions/github-script@v8
        with:
          script: |
            const tag = process.env.DEV_RELEASE_TAG;
            const { owner, repo } = context.repo;

            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.data.id });
              core.info(`Deleted development release ${tag}`);
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
              core.info(`No release found for ${tag}`);
            }

            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
              core.info(`Deleted tag ${tag}`);
            } catch (error) {
              if (error.status !== 404 && error.status !== 422) {
                throw error;
              }
              core.info(`No tag found for ${tag}`);
            }
