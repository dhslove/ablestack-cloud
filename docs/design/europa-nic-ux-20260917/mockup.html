<script>
const $=s=>document.querySelector(s);const params=new URLSearchParams(location.search);let theme=params.get('theme')||'dark', vmstate='Running', selected=1, screen=params.get('screen')||'main', createdType='Isolated', menu=null, operation='create', stateVariant='main';
const networks=[{id:0,name:'frontend-net',type:'Isolated',ip:'10.20.0.21',mac:'02:00:5e:10:00:21',default:true,enabled:true,link:true},{id:1,name:'backend-net',type:'Shared',ip:'10.30.0.21',mac:'02:00:5e:20:00:21',default:false,enabled:true,link:true},{id:2,name:'replication-l2',type:'L2',ip:'Cloud IP 관리 안 함',mac:'02:00:5e:30:00:21',default:false,enabled:false,link:false}];

const context='<p class="context">VM: europa-app-01 · Zone: zone-a · 소유자: service-team</p>';
function shell(){let readOnly=stateVariant==='readonly',blocked=vmstate==='Starting'||readOnly||stateVariant==='stale';return `<header class="top"><div class="brand"><b>☁</b> ABLESTACK</div><span class="muted">☰　 기본 보기</span><span class="account">AC　admin cloud</span></header><div class="layout"><aside class="nav"><div>대시보드</div><div>컴퓨트</div><div class="active">　가상머신</div><div>　VM 스냅샷</div><div>　가상머신 그룹</div><div>스토리지</div><div>네트워크</div><div>이미지</div><div>키 관리</div><div>재해복구</div><div>이벤트</div><div>인프라스트럭쳐</div><div>서비스 오퍼링</div><div>구성</div></aside><main class="work"><p class="breadcrumb">⌂ / 가상머신 / <strong>europa-app-01</strong></p><div class="detail"><aside class="vmcard"><div class="os">▦</div><h2>europa-app-01</h2><span class="tag">x86_64</span><span class="tag">KVM</span><div class="pair"><strong>상태</strong><span class="${vmstate==='Running'?'status':'muted'}">● ${vmstate==='Running'?'실행 중':vmstate==='Stopped'?'정지됨':'시작 중'}</span></div><div class="pair"><strong>CPU</strong>2 CPU × 2.00 GHz</div><div class="pair"><strong>메모리</strong>4096 MB</div><div class="pair"><strong>네트워크</strong>${networks.length} NIC(s)<br>${networks.map(n=>`<div style="margin-top:8px">NIC ${n.id}　${n.default?'<span class="tag default">기본</span>':''}<br><span class="link">${escape(n.name)}</span></div>`).join('')}</div><div class="pair"><strong>Zone / 계정</strong>zone-a / service-team</div></aside><section class="panel"><nav class="tabs">${['상세','메트릭','ISO','볼륨','NIC','IP 구성','VM 스냅샷','DR 계획','백업','장애보호','스케줄','장치','설정'].map(n=>`<div class="${n==='NIC'?'active':''}">${n}</div>`).join('')}</nav><div class="content"><div class="toolbar">${readOnly?'':button('＋ 생성 및 연결','create','primary',blocked)+button('기존 네트워크 연결','attach','',blocked)}${button('↻ 새로고침','refresh')}<input id="search" aria-label="네트워크 검색" placeholder="네트워크 이름 / IP / MAC 검색"></div>${readOnly?alert('읽기 전용','현재 역할에서 허용된 조회 기능만 표시합니다.'):''}${vmstate==='Starting'?alert('VM 시작 중','작업이 끝나면 네트워크를 변경할 수 있습니다.','warning'):''}${stateVariant==='stale'?alert('최신 정보를 가져오지 못했습니다.','마지막으로 확인한 목록을 유지합니다. 새로고침 후 변경 작업을 진행하세요.','warning'):''}<div class="table-scroll"><table><thead><tr><th>네트워크 / 유형</th><th>장치 ID</th><th>주소</th><th>NIC / 링크 상태</th><th>작업</th></tr></thead><tbody>${networks.map(n=>`<tr data-row="${n.id}"><td><button class="network-name link" data-action="details" data-nic="${n.id}" style="border:0;padding:0">${escape(n.name)}</button><br><span class="tag">${n.type}</span>${n.default?'<span class="tag default">기본</span>':''}</td><td>${n.id}</td><td>${n.ip}<small>${n.mac}</small></td><td><span class="${n.enabled?'status':'off'}">${n.enabled?'● 활성':'○ 비활성'}</span><small>링크 ${n.link?'UP':'DOWN'}</small></td><td class="actions">${readOnly?button('상세','details'): `<span title="${n.default?'기본 NIC입니다. 다른 NIC를 기본으로 설정한 후 해제하세요.':''}">${button('연결 해제','detach','',n.default||blocked||stateVariant==='stale')}</span> ${button('⌄','menu','',blocked)}`}</td></tr>`).join('')}</tbody></table></div><p class="caption">${networks.length}개 NIC · IP/MAC는 링크 DOWN 상태에서도 유지 표시합니다.</p>${stateVariant==='stale'?'':`<p class="caption">기본 NIC를 해제하려면 다른 NIC를 먼저 기본으로 설정하세요.</p>`}</div></section></div></main></div>`}
const titles={create:'신규 네트워크 생성 및 연결',attach:'기존 네트워크 연결',detach:'네트워크 연결 해제',default:'기본 NIC 설정',enable:'NIC 활성화 / 비활성화',link:'NIC 링크 상태 변경',address:'IP / MAC 주소 변경',secondary:'보조 IP 관리','secondary-remove':'보조 IP 해제',details:'NIC 상세',progress:'네트워크 작업 진행',partial:'네트워크 연결 재시도',unknown:'작업 결과 확인 필요',empty:'기존 네트워크 연결',complete:'네트워크 작업 완료'};
function dialog(kind,opt={}){const n=networks.find(x=>x.id===selected)||networks[1]||networks[0];let body='',footer=button('취소','close'),title=titles[kind]||kind;const type=opt.type||createdType;const isGallery=opt.gallery;
if(kind==='create'){

if(type==='Shared')body+=`<div class="fields">${select('물리 네트워크 *',['Guest network'])}${select('접근 범위 *',['VM 소유 계정 / 프로젝트'],'공유 범위 확대는 별도 네트워크 화면에서 관리')}${field('게이트웨이 *','10.40.0.1')}${field('넷마스크 *','255.255.255.0')}${field('시작 IP *','10.40.0.20')}${field('끝 IP','10.40.0.200')}${field('VLAN','240','오퍼링 및 권한이 허용할 때만 표시')}${select('IP 버전',['IPv4','IPv4 + IPv6'],'IPv6 선택 시 기존 생성 폼의 필수 필드 표시')}</div>`;
if(type==='L2')body+=`<div class="fields">${select('물리 네트워크',['Guest network'])}${field('VLAN','240','오퍼링 및 권한이 허용할 때만 표시')}</div>`+alert('L2 네트워크는 Cloud에서 IP를 할당하지 않습니다.','게스트 OS의 IP 설정은 별도 IP 구성 탭에서 처리합니다.');
body+=`<div class="fields">${field('VM 연결 IP','',type==='L2'?'L2에서는 입력할 수 없습니다.':'비우면 자동 할당',type==='L2')}${field('VM 연결 MAC','', '비우면 자동 생성')}</div>`+check('연결 후 기본 NIC로 설정')+alert('생성된 네트워크는 연결에 실패해도 유지됩니다.','실패 시 같은 네트워크를 사용해 연결 단계만 다시 시도할 수 있습니다.');

}else if(kind==='secondary-remove'){

function render(){document.body.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'라이트 모드':'다크 모드';$('#app').innerHTML=shell();$('#search')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('[data-row]').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))})}
function open(kind){$('#portal').innerHTML=`<div class="overlay">${dialog(kind)}</div>`;$('#portal button')?.focus()}
function close(){ $('#portal').innerHTML='';$('#screen').value='main';$('#app button')?.focus() }
function notify(text){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.textContent=text;document.body.append(d);setTimeout(()=>d.remove(),3500)}
function showMenu(el){document.querySelector('.menu')?.remove();const n=networks.find(x=>x.id===selected);const d=document.createElement('div');d.className='menu';d.setAttribute('role','menu');d.innerHTML=button('基本 NIC로 설정'.replace('基本','기본'),'default','',n.default)+button(n.enabled?'NIC 비활성화':'NIC 활성화','enable')+button(n.link?'링크 DOWN으로 변경':'링크 UP으로 변경','link')+button('IP / MAC 주소 변경','address')+button('보조 IP 관리','secondary','',n.type==='L2')+'<hr>'+button('NIC 상세','details')+button('연결 해제','detach','danger',n.default);document.body.append(d);const r=el.getBoundingClientRect();d.style.left=Math.min(r.right-230,innerWidth-240)+'px';d.style.top=Math.min(r.bottom+5,innerHeight-d.offsetHeight-12)+'px'}
document.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn){if(!e.target.closest('.menu'))document.querySelector('.menu')?.remove();return}const row=btn.closest('[data-row]');if(row)selected=Number(row.dataset.row);const a=btn.dataset.action;if(a==='menu'){showMenu(btn);return}document.querySelector('.menu')?.remove();if(a==='close'){close();return}if(a==='refresh'){stateVariant='main';render();notify('예시 목록을 새로고침했습니다.');return}if(a.startsWith('submit-')){operation=a.slice(7);if(operation==='detach'){networks.splice(networks.findIndex(n=>n.id===selected),1);render()}if(operation==='default'){networks.forEach(n=>n.default=n.id===selected);render()}if(operation==='enable'){const n=networks.find(n=>n.id===selected);n.enabled=$('[data-field=enabled]').value==='활성';render()}if(operation==='link'){const n=networks.find(n=>n.id===selected);n.link=$('[data-field=link]').value==='UP';render()}open('progress');return}if(a==='retry'){operation='create';open('progress');return}if(a==='check'){open('complete');return}open(a)});
document.addEventListener('change',e=>{if(e.target.dataset.field==='ack'){const b=$('#portal .dialog-foot button:last-child');b.disabled=!e.target.checked}if(e.target.dataset.field==='attach-net'){const l2=e.target.value.includes('L2');const ip=$('#portal .fields input');ip.disabled=l2;ip.value='';ip.parentElement.querySelector('small').textContent=l2?'L2에서는 IP를 할당하지 않습니다.':'비우면 자동 할당';$('#portal .summary dd').textContent=l2?'L2 / Setup':'Isolated / Implemented'}if(e.target.dataset.field==='type'){createdType=e.target.value;open('create')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();document.querySelector('.menu')?.remove()}if(e.key==='Tab'&&$('.overlay')){const items=[...$('.overlay').querySelectorAll('button:not(:disabled),input:not(:disabled),select')];if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus()}}});
$('#theme').onclick=()=>{theme=theme==='dark'?'light':'dark';document.body.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'라이트 모드':'다크 모드'};
$('#vmstate').onchange=e=>{vmstate=e.target.value;render();if($('#portal').textContent.includes('IP / MAC 주소 변경'))open('address')};
$('#screen').onchange=e=>{screen=e.target.value;if(['main','stale','readonly'].includes(screen)){stateVariant=screen;close();render()}else{selected=1;open(screen)}};
const sheets=[['create:Isolated','create:Shared'],['create:L2','attach'],['detach','default'],['enable','link'],['address','secondary'],['secondary-remove','details'],['progress','partial'],['unknown','complete'],['empty','address:L2'],['address:Stopped','enable:off']];
function gallery(sheet){document.body.classList.add('atlas');document.body.dataset.theme=theme;$('#theme').textContent=theme==='dark'?'라이트 모드':'다크 모드';$('#app').innerHTML=`<main class="gallery"><h1>NIC 대화상자 · ${sheet+1} / ${sheets.length}</h1><p class="muted">${theme==='dark'?'다크':'라이트'} 모드 · 예시 데이터 · 실제 시스템에 영향을 주지 않는 설계 시안</p><div class="gallery-grid">${sheets[sheet].map((x,i)=>{let[kind,type]=x.split(':');selected=type==='L2'&&kind==='address'||type==='off'?2:1;vmstate=type==='Stopped'?'Stopped':'Running';const html=dialog(kind,{type,gallery:true});return `<div><p class="spec-label">${String(sheet*2+i+1).padStart(2,'0')}　${titles[kind]}${type?' / '+type:''}</p>${html}</div>`}).join('')}</div><p class="footnote">기존 API 기반 UI 설계</p></main>`;$('.footnote').textContent='기존 생성 폼의 조건부 필드와 API 권한을 유지합니다. 모든 작업은 기존 API를 사용합니다.'}
