const params=new URLSearchParams(location.search),tab=params.get('tab')||'ip',dark=params.get('theme')==='dark',overview=tab==='overview';
if(dark)document.documentElement.classList.add('dark-mode');if(params.get('mobile'))document.body.classList.add('mobile');
const icon=(name)=>{const paths={reload:'M21 12a9 9 0 1 1-3-6.7M21 3v6h-6',plus:'M12 4v16M4 12h16',search:'M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm6-2 6 6',trash:'M3 6h18M8 6V3h8v3M6 6l1 15h10l1-15M10 10v7M14 10v7'};return `<svg class="icon" viewBox="0 0 24 24" fill="none" style="fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round">${'<path d="'+paths[name]+'"/>'}</svg>`};

const selector=t=>`<span class="select">${t}<span>⌄</span></span>`;

const ipToolbar=()=>`<div class="toolbar" data-toolbar="ip">${btn('지금 재수집',true)}${btn('업데이트',false,'reload')}</div>`;
const ipContent=(compact=false)=>`${ipToolbar()}<div class="info"><span>ⓘ</span><span>이 화면은 DB에 저장된 최신 게스트 네트워크 스냅샷을 조회합니다. 화면 새로고침은 호스트 또는 Agent를 호출하지 않습니다. Rocky Linux 등 일부 운영체제에서는 라우팅 및 DNS 정보를 수집하기 위해 ABLESTACK 게스트 도구 설치가 필요할 수 있습니다.</span></div>${facts()}<div class="section-title">게스트 인터페이스 및 IP 주소 <span class="muted">ⓘ</span></div><div class="box"><header><strong>enp3s0</strong><span class="tag blue">기본</span></header><p><span class="muted">하드웨어 주소</span>　<span class="link">02:1f:00:cc:00:34</span></p><div class="address-line"><span class="tag green">IPv4</span><span class="link">10.10.254.169/16</span><span class="tag blue">주 IP</span><span class="tag blue">Cloud 주 IP</span></div>${compact?'':'<div class="address-line"><span class="tag">IPv6</span><span class="link">fd12:8ea6:72a:69eb:1f:ff:fecc:34/64</span></div>'}</div>${compact?'':`<div class="section-title">게스트 라우팅 테이블 <span class="muted">ⓘ</span></div><div class="toolbar"><div class="search route-search">대상, 게이트웨이, 인터페이스 검색<span>${icon('search')}</span></div>${selector('모두')}<span class="muted">라우팅 17개</span></div><div class="table-scroll"><table><thead><tr><th>주소 유형</th><th>목적지</th><th>게이트웨이</th><th>인터페이스</th><th>메트릭</th></tr></thead><tbody><tr><td>IPv4</td><td>0.0.0.0/0</td><td>10.10.0.1</td><td>enp3s0</td><td>100</td></tr><tr><td>IPv4</td><td>10.10.0.0/16</td><td>On-link</td><td>enp3s0</td><td>100</td></tr></tbody></table></div><div class="section-title">게스트 DNS 설정 <span class="muted">ⓘ</span></div><div class="box"><span class="muted">정보 출처</span> resolvectl　<span class="muted">DNS 서버</span> 210.220.163.82, 219.250.36.130</div>`}`;
const chart=(name,unit,second=false,compact=false)=>`<div class="chart-section"><div class="chart-heading"><strong>${name} <span class="muted">ⓘ</span></strong>${name==='메모리'?selector('Raw 데이터')+selector('사용됨'):''}${name==='디스크'?selector('읽기 및 쓰기'):''}${selector(unit)}</div><svg class="chart" viewBox="0 0 760 138" preserveAspectRatio="none"><g class="grid"><path d="M45 12H746M45 55H746M45 98H746"/></g><text x="4" y="17">${unit==='%'?'100':'4'}</text><text x="12" y="60">${unit==='%'?'50':'2'}</text><text x="20" y="103">0</text><path class="data" d="M45 87L90 78L135 84L180 69L225 73L270 77L315 66L360 75L405 61L450 70L495 73L540 62L585 64L630 58L675 67L720 59L746 64"/>${second?'<path class="data second" d="M45 96L90 93L135 91L180 95L225 89L270 87L315 93L360 87L405 85L450 92L495 90L540 83L585 87L630 86L675 83L720 90L746 86"/>':''}<text x="45" y="129">20:20</text><text x="268" y="129">20:40</text><text x="498" y="129">21:00</text><text x="706" y="129">21:20</text></svg>${second?'<div class="legend"><span><i></i>읽기</span><span><i class="green"></i>쓰기</span></div>':''}</div>`;
const metricsContent=(compact=false)=>`<div class="toolbar" data-toolbar="metrics"><div class="segmented"><span class="selected">1시간</span><span>6시간</span><span>Custom</span></div><span class="muted">ⓘ</span><div class="right"><span class="muted">자동 새로고침 주기</span>${selector('없음')}</div></div>${chart('CPU','%')}${chart('메모리','GB')}${compact?'':chart('디스크','KiB',true)+chart('네트워크','MiB',true)}`;
const eventsContent=(compact=false)=>`<div class="toolbar" data-toolbar="events">${btn('업데이트',false,'reload')}<div class="right">${selector('표시 컬럼')}</div></div><div class="table-scroll"><table><thead><tr>${(compact?['레벨','유형','상태','생성일']:['레벨','유형','상태','사용자 이름','계정','도메인','생성일']).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${[['VM.START','완료','2026. 10. 1. 21:05'],['VM.ISO.ATTACH','완료','2026. 10. 1. 20:54'],['VM.UPDATE','완료','2026. 10. 1. 20:32']].map(a=>`<tr><td><span class="tag blue">INFO</span></td><td class="link">${a[0]}</td><td>${a[1]}</td>${compact?'':'<td>admin</td><td>admin</td><td>ROOT</td>'}<td>${a[2]}</td></tr>`).join('')}</tbody></table></div>${pagination(3)}`;
const commentsContent=(compact=false)=>`<div class="toolbar" data-toolbar="comments">${btn('보내기',true)}${btn('업데이트',false,'reload')}<div class="right muted">코멘트 (2)</div></div><div class="composer"><textarea placeholder="메모 추가">게스트 네트워크 설정을 확인했습니다.</textarea><label><input type="checkbox"> 관리자만 표시</label></div>${[['admin','2026. 10. 1. 오후 9:05','가상머신 초기 구성을 완료했습니다.'],['admin','2026. 10. 1. 오후 8:42','다음 점검 시 네트워크 설정을 확인해 주세요.']].slice(0,compact?1:2).map(([a,b,c])=>`<div class="comment-row"><span class="avatar">AC</span><div class="comment-main"><div class="comment-meta"><strong>${a}</strong><span>${b}</span></div><p>${c}</p><span class="visibility">◉ 모두 표시</span></div><button class="row-circle" aria-label="삭제">${icon('trash')}</button></div>`).join('')}${compact?'':pagination(2)}`;
const tabs=['상세','IP 구성','메트릭','프로세스','스케줄','ISO','볼륨','NIC','설정','호스트 장치','VM 스냅샷','이벤트','코멘트'];
const names={ip:'IP 구성',metrics:'메트릭',events:'이벤트',comments:'코멘트'},contents={ip:ipContent,metrics:metricsContent,events:eventsContent,comments:commentsContent};
